<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ur</title>
<style>
  :root { color-scheme: dark; background: #101d22; color: #f2e7d3; font: 16px system-ui, sans-serif; }
  body { margin: 0 auto; width: min(94vw, 880px); padding: 20px 0; }
  header, nav { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
  header { justify-content: space-between; }
  h1 { margin: 0; font-size: 2.2rem; }
  nav { margin: 12px 0; }
  button { color: inherit; background: #23363e; border: 1px solid #50626a; border-radius: 5px; padding: 8px 12px; font: inherit; }
  button[aria-pressed="true"] { background: #e2bb77; color: #18242a; }
  canvas { display: block; width: 100%; aspect-ratio: 60 / 44; background: #163442; cursor: crosshair; }
  body.comparison { width: 100vw; margin: 0; padding: 0; }
  body.comparison > :not(canvas) { display: none; }
  p { margin: 9px 0; }
  #parcel { color: #b9c4bf; min-height: 1.5em; }
</style>
<header><h1>Ur</h1><output id="city"></output></header>
<nav aria-label="Planning tools">
  <button data-tool="1" aria-pressed="true" disabled>1 · Road</button>
  <button data-tool="2" aria-pressed="false" disabled>2 · Housing</button>
  <button data-tool="3" aria-pressed="false" disabled>3 · Employment</button>
  <button data-tool="4" aria-pressed="false" disabled>4 · Overpass</button>
  <button id="view" aria-pressed="true" disabled>3D terrain</button>
  <button id="month" disabled>Advance month</button>
</nav>
<canvas width="900" height="660" tabindex="0" aria-label="Ur parcel map"></canvas>
<p id="status" role="status">Loading Ur…</p>
<p id="parcel"></p>
<p id="camera-controls">Focus the map to pan with arrows, orbit with Q/E, and reset with Home. Scroll or use +/− to zoom.</p>
<script type="module" src="./app.mjs?v=4"></script>
</html>
