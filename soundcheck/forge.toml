[package]
name = "soundcheck"
version = "0.1.0"
type = "app"
description = "Strata's audio scenes, rendered in game time for listening and for the audio goldens"
author = ""
license = ""

[deps]
strata = { path = ".." }

# forge does not build a dependency's C sources, so the consumer lists
# Strata's audio shim itself. It needs no library beyond the system's.
[ffi]
sources = ["../native/strata_audio.c"]
link = ["-I../native"]
