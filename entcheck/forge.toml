[package]
name = "entcheck"
version = "0.1.0"
type = "app"
description = "Strata's entity checks: scenes run against the entity kernel through Strata.Entities, headless"
author = ""
license = ""

[deps]
strata = { path = ".." }

# forge does not build a dependency's C sources (GAPS S11), so the consumer
# lists Strata's shims itself: the entity kernel, the pose kernel (later
# tasks give entities figures) and the noise the library's terrain uses.
# None needs a library beyond the system's.
[ffi]
sources = ["../native/strata_ent.c", "../native/strata_anim.c", "../native/strata_noise.c"]
link = ["-I../native", "-ffp-contract=off"]
