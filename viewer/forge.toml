[package]
name = "strata_viewer"
version = "0.1.0"
type = "app"
description = "A fly-through of a Strata world: the first rendering slice"
author = ""
license = ""

[deps]
strata = { path = ".." }

# forge does not build a dependency's C sources, so the consumer lists
# Strata's shim itself. -I flags ride along in `link`.
[ffi]
sources = ["../native/strata_vk.c", "../native/strata_text.c", "../native/strata_audio.c", "../native/strata_noise.c"]
link = ["-I../native", "-ffp-contract=off", "-I/opt/homebrew/include", "-I../native/sheenbidi/Headers", "-I/opt/homebrew/include/freetype2", "-I/opt/homebrew/include/harfbuzz", "-L/opt/homebrew/lib", "-lglfw", "-lvulkan", "-lfreetype", "-lharfbuzz", "-Wl,-rpath,/opt/homebrew/lib"]
