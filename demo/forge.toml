[package]
name = "strata_demo"
version = "0.1.0"
type = "app"
description = "A headless run of the Strata voxel core: stream, edit, mesh, measure"
author = ""
license = ""

[deps]
strata = { path = ".." }

# forge does not build a dependency's C sources, so the consumer lists
# Strata's noise and .vox shims itself.
[ffi]
sources = ["../native/strata_noise.c", "../native/strata_vox.cpp"]
link = ["-I../native", "-ffp-contract=off", "-fno-exceptions"]
