[package]
name = "animcheck"
version = "0.1.0"
type = "app"
description = "Strata's animation checks: scenes run against the pose kernel through Strata.Anim, headless"
author = ""
license = ""

[deps]
strata = { path = ".." }

# forge does not build a dependency's C sources, so the consumer lists
# Strata's animation shim itself. It needs no library beyond the system's.
[ffi]
sources = ["../native/strata_anim.c"]
link = ["-I../native"]
