[package]
name = "populate_fields"
version = "0.1.0"
type = "app"
description = "CPU cost of Strata.Populate.fields_with over 32 x 32 columns (4 fields, 3 layers)"
author = ""
license = ""

[deps]
strata = { path = "../.." }

# forge does not build a dependency's C sources (GAPS S11)
[ffi]
sources = ["../../native/strata_noise.c", "../../native/strata_vox.cpp"]
link = ["-I../../native", "-ffp-contract=off", "-fno-exceptions"]
