[package]
name = "chunk_stages"
version = "0.1.0"
type = "app"
description = "Stage-by-stage CPU cost of one island surface chunk (docs/2026-11-12-chunk-performance-findings.md)"
author = ""
license = ""

[deps]
strata = { path = "../.." }

# as viewer/forge.toml: the generated copy of the viewer's library refers to the Vulkan shim
[ffi]
sources = ["../../native/strata_vk.c", "../../native/strata_noise.c", "../../native/strata_vox.cpp"]
link = ["-I../../native", "-ffp-contract=off", "-fno-exceptions", "-I/opt/homebrew/include", "-L/opt/homebrew/lib", "-lglfw", "-lvulkan", "-Wl,-rpath,/opt/homebrew/lib"]
