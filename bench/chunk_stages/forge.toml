[package]
name = "chunk_stages"
version = "0.1.0"
type = "app"
description = "Stage-by-stage CPU cost of one island surface chunk (docs/2026-11-12-chunk-performance-findings.md)"
author = ""
license = ""

[deps]
strata = { path = "../.." }

# as viewer/forge.toml: the generated copy of the viewer's library refers to the Vulkan shim
[ffi]
sources = ["../../native/strata_vk.c", "../../native/strata_text.c", "../../native/strata_audio.c", "../../native/strata_noise.c", "../../native/strata_anim.c", "../../native/strata_ent.c", "../../native/strata_vox.cpp"]
link = ["-I../../native", "-Wno-override-module", "-ffp-contract=off", "-fno-exceptions", "-I/opt/homebrew/include", "-I../../native/sheenbidi/Headers", "-I/opt/homebrew/include/freetype2", "-I/opt/homebrew/include/harfbuzz", "-L/opt/homebrew/lib", "-lglfw", "-lvulkan", "-lfreetype", "-lharfbuzz", "-Wl,-rpath,/opt/homebrew/lib"]
