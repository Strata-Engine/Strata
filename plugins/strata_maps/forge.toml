[package]
name = "strata_maps"
version = "0.1.0"
type = "lib"
description = "Bounded tactical maps for Strata, as a plugin (docs/plugins.md): terrain, rivers, settlements, vegetation, hazards and ruin from layered settings, checked for play"
author = ""
license = ""

[deps]
strata = { path = "../.." }
strata_tactics = { path = "../strata_tactics" }

# forge does not build a dependency's C sources (GAPS S11).
[ffi]
sources = ["../../native/strata_noise.c", "../../native/strata_vox.cpp"]
link = ["-I../../native", "-ffp-contract=off", "-fno-exceptions"]
