[package]
name = "strata_tactics"
version = "0.1.0"
type = "lib"
description = "A tactical layer for Strata worlds: a tile grid, an FFT turn clock and an XCOM-style camera, as a plugin (docs/plugins.md)"
author = ""
license = ""

[deps]
strata = { path = "../.." }

# forge does not build a dependency's C sources (GAPS S11), so the consumer
# lists Strata's noise and .vox shims itself, as demo/forge.toml does.
[ffi]
sources = ["../../native/strata_noise.c", "../../native/strata_vox.cpp"]
link = ["-I../../native", "-ffp-contract=off", "-fno-exceptions"]
