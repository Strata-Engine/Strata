[package]
name = "strata_kit"
version = "0.1.0"
type = "lib"
description = "Modular voxel figures for Strata, as a plugin (docs/plugins.md): parts with typed mounts, assembled into a rig, walking, carved by hits, breaking off and settling as rubble"
author = ""
license = ""

[deps]
strata = { path = "../.." }

# forge does not build a dependency's C sources (GAPS S11): Strata's shims are
# listed here; the animation kernel because figures are posed by it.
[ffi]
sources = ["../../native/strata_noise.c", "../../native/strata_vox.cpp", "../../native/strata_anim.c"]
link = ["-I../../native", "-ffp-contract=off", "-fno-exceptions"]
